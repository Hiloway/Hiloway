name: Profile Auto Update

on:
  schedule:
    - cron: '0 20 * * 0'   # 每周日 UTC 20:00 (北京时间周一凌晨)
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新最近活动区 (GitHub API)
        run: |
          python3 << 'PYEOF'
import json, urllib.request, re, os

token = os.environ.get("GITHUB_TOKEN", "")
def api(url):
    req = urllib.request.Request(url)
    req.add_header("Authorization", f"token {token}")
    req.add_header("Accept", "application/vnd.github+json")
    try:
        with urllib.request.urlopen(req, timeout=20) as r:
            return json.loads(r.read())
    except Exception:
        return None

# 最近公开活动 (push 类)
events = api("https://api.github.com/users/Hiloway/events/public?per_page=30") or []
lines = []
seen = set()
for ev in events:
    if ev.get("type") not in ("PushEvent", "CreateEvent", "PullRequestEvent", "IssuesEvent"): continue
    repo = ev.get("repo", {}).get("name", "")
    if repo in seen: continue
    seen.add(repo)
    ts = (ev.get("created_at") or "")[:10]
    et = ev["type"]
    if et == "PushEvent":
        n = len(ev.get("payload", {}).get("commits", []))
        lines.append(f"- 🔨 `{ts}` 推送 {n} 个提交到 [{repo}](https://github.com/{repo})")
    elif et == "CreateEvent":
        lines.append(f"- 🎉 `{ts}` 创建了 [{repo}](https://github.com/{repo})")
    elif et == "PullRequestEvent" and ev.get("payload", {}).get("action") == "opened":
        lines.append(f"- 🔀 `{ts}` 在 [{repo}](https://github.com/{repo}) 开启 PR")
    if len(lines) >= 5: break

# 读 README, 替换活动区
path = "README.md"
with open(path, encoding="utf-8") as f:
    readme = f.read()

block = "\n".join(lines) if lines else "*（暂无公开活动）*"
new_sec = f"<!--START_SECTION:activity-->\n{block}\n<!--END_SECTION:activity-->"
readme = re.sub(r"<!--START_SECTION:activity-->.*?<!--END_SECTION:activity-->", new_sec, readme, flags=re.S)

with open(path, "w", encoding="utf-8") as f:
    f.write(readme)
print("活动区已更新:", len(lines), "条")
PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交变更
        run: |
          git config user.name "Hiloway"
          git config user.email "2819558238@qq.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 自动更新最近活动 [skip ci]"
            git push
          fi
